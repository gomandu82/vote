<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>추수감사제 하모니상 투표</title>
<style>
:root{--bg:#faf6ee;--card:#fff;--tx:#2b2418;--mu:#7a6e5c;--ac:#b45f1b;--ac2:#fbe9d6;--bd:#e6dccb}
@media (prefers-color-scheme:dark){:root{--bg:#1d1a15;--card:#2a251d;--tx:#f1e9da;--mu:#b3a791;--ac:#f0a35e;--ac2:#3b2d1d;--bd:#40382b}}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:8px 0 4px;text-align:center}
p.s{color:var(--mu);margin:0 0 16px;font-size:14px;text-align:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
.grid,.tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tabs{margin-bottom:14px}
button.o{padding:12px 8px;border:1.5px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
button.o.on{border-color:var(--ac);background:var(--ac2);font-weight:700}
button.o:disabled{opacity:.35;cursor:not-allowed}
button.p{width:100%;padding:14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit}
button.p:disabled{opacity:.4}
.lk{background:none;border:0;color:var(--mu);text-decoration:underline;cursor:pointer;font-size:14px;font-family:inherit;padding:8px}
.bot{text-align:center;margin-top:28px}
.msg{text-align:center;padding:36px 12px}
.verse{font-size:19px;line-height:1.8;margin:18px 0 6px;font-weight:600}
.ref,.det{color:var(--mu);font-size:13px}
.big{font-size:44px;font-weight:800;color:var(--ac);margin:10px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 6px;border-bottom:1px solid var(--bd);text-align:center}
th:first-child,td:first-child{text-align:left}
.bar{height:8px;background:var(--ac);border-radius:4px;margin-top:4px}
.scroll{overflow-x:auto}
.err{color:#c0392b;font-size:14px;margin-top:8px;text-align:center}
input,textarea{width:100%;box-sizing:border-box;padding:12px;font-size:16px;font-family:inherit;border:1.5px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx)}
input{font-size:18px;margin-bottom:10px;text-align:center;letter-spacing:6px}
textarea{resize:vertical}
.cm{border-bottom:1px solid var(--bd);padding:10px 2px;font-size:15px}
.rb{margin-top:8px;width:100%}
.tabs{grid-template-columns:1fr 1fr 1fr}
.cf{text-align:left;letter-spacing:normal;font-size:16px;margin-bottom:12px}
label.lb{display:block;margin:0 0 4px}
</style>
</head>
<body>
<main><div id="app"></div></main>
<script>
// ▼▼▼ Apps Script 웹 앱 주소(/exec). 새로 배포해서 주소가 바뀌면 여기만 바꾸세요. ▼▼▼
var API_URL="https://script.google.com/macros/s/AKfycby_xaA-vVunN2uK5Xnov3X9-pUR-qnAOdqEP9RAxzksJOHZ7euutA85065YsXKd2q5P4g/exec";
// ▲▲▲
(function(){
  var NAMES=["getSettings","submitVote","getResults","resetVotes","saveSettings"];
  function call(fn,args){
    return fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({fn:fn,args:args})})
      .then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json();});
  }
  function mk(){
    var ok=null,ko=null,r={withSuccessHandler:function(f){ok=f;return r;},withFailureHandler:function(f){ko=f;return r;}};
    NAMES.forEach(function(n){r[n]=function(){
      call(n,[].slice.call(arguments)).then(function(v){if(ok)ok(v);}).catch(function(e){if(ko)ko(e);});
    };});
    return r;
  }
  window.google={script:{get run(){return mk();}}};
})();
</script>
<script>
var GROUPS=["사랑대목장","희락대목장","화평대목장","양선대목장","충성대목장","인내대목장","절제대목장","온유대목장","신중년대목장","중등부","고등부","청년부","유아부","유치부","유년부","초등부"];
var TARGETS=GROUPS.slice(0,8);
var FIELDS=[{"k": "s1_title", "label": "① 첫 화면 - 제목", "def": "추수감사제"}, {"k": "s1_sub", "label": "① 첫 화면 - 안내 문구", "def": "나의 목장 또는 기관을 선택해 주세요"}, {"k": "s1_btn", "label": "① 첫 화면 - 버튼", "def": "선택하기"}, {"k": "s2_title", "label": "② 투표 화면 - 제목", "def": "하모니상 투표"}, {"k": "s2_sub", "label": "② 투표 화면 - 안내 문구", "def": "가장 잘 화합한 대목장을 선택해 주세요\n(소속 대목장은 선택할 수 없습니다)", "ml": true}, {"k": "s2_reason", "label": "② 투표 화면 - 이유 입력칸 제목", "def": "투표 이유 (선택)"}, {"k": "s2_ph", "label": "② 투표 화면 - 이유 입력칸 안내", "def": "이 대목장을 선택한 이유를 적어 주세요"}, {"k": "s2_btn", "label": "② 투표 화면 - 버튼", "def": "투표하기"}, {"k": "s3_verse", "label": "③ 말씀 화면 - 말씀", "def": "여호와께 감사하라\n그는 선하시고\n그 인자하심이 영원함이로다.", "ml": true}, {"k": "s3_ref", "label": "③ 말씀 화면 - 출처", "def": "시편 136:1"}, {"k": "s3_btn", "label": "③ 말씀 화면 - 버튼", "def": "투표마치기"}, {"k": "s4_title", "label": "④ 마지막 화면 - 제목", "def": "끝!"}, {"k": "s4_msg", "label": "④ 마지막 화면 - 감사 문구", "def": "투표해 주셔서 감사합니다"}];
var CFG={"s1_title": "추수감사제", "s1_sub": "나의 목장 또는 기관을 선택해 주세요", "s1_btn": "선택하기", "s2_title": "하모니상 투표", "s2_sub": "가장 잘 화합한 대목장을 선택해 주세요\n(소속 대목장은 선택할 수 없습니다)", "s2_reason": "투표 이유 (선택)", "s2_ph": "이 대목장을 선택한 이유를 적어 주세요", "s2_btn": "투표하기", "s3_verse": "여호와께 감사하라\n그는 선하시고\n그 인자하심이 영원함이로다.", "s3_ref": "시편 136:1", "s3_btn": "투표마치기", "s4_title": "끝!", "s4_msg": "투표해 주셔서 감사합니다"};
function T(k){return CFG[k];}
function tx(k){return esc(T(k)).replace(/\n/g,'<br>');}
var app=document.getElementById("app");
var st={step:1,mine:null,pick:null,reason:"",err:"",dup:false,busy:false,view:"vote",pw:"",auth:false,tab:1,rows:null,rc:false};

function voted(){try{return localStorage.getItem("voted_v2")==="1";}catch(e){return false;}}
function setVoted(v){try{if(v)localStorage.setItem("voted_v2","1");else localStorage.removeItem("voted_v2");}catch(e){}}
function devId(){
  try{var d=localStorage.getItem("dev_id");
    if(!d){d=Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);localStorage.setItem("dev_id",d);}
    return d;}catch(e){return null;}
}
if(voted())st.step=4;

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function head(t,s){return '<h1>'+t+'</h1><p class="s">'+s+'</p>';}
function grid(sel,dis,fn,list){
  return '<div class="grid">'+list.map(function(g){
    return '<button class="o'+(sel===g?' on':'')+'" data-g="'+g+'" data-f="'+fn+'"'+(dis===g?' disabled':'')+'>'+g+'</button>';
  }).join('')+'</div>';
}
function fail(e){st.busy=false;st.err="서버 연결 실패: "+((e&&e.message)||"잠시 후 다시 시도해 주세요.");render();}

function render(){
  if(st.view==="admin")return renderAdmin();
  var h="",res='<div class="bot"><button class="lk" id="resBtn">투표 결과 확인하기</button>';
  if(st.step===1){
    h=head('🍂 '+tx('s1_title'),tx('s1_sub'))+
      '<div class="card">'+grid(st.mine,null,'mine',GROUPS)+'</div>'+
      '<button class="p" id="go1"'+(st.mine?'':' disabled')+'>'+tx('s1_btn')+'</button>'+res+'</div>';
  }else if(st.step===2){
    h=head('🎵 '+tx('s2_title'),tx('s2_sub'))+
      '<div class="card">'+grid(st.pick,st.mine,'pick',TARGETS)+'</div>'+
      '<div class="card"><h2>'+tx('s2_reason')+'</h2><textarea id="why" maxlength="300" rows="4" placeholder="'+esc(T('s2_ph'))+'">'+esc(st.reason)+'</textarea></div>'+
      '<button class="p" id="go2"'+(st.pick&&!st.busy?'':' disabled')+'>'+(st.busy?'저장 중…':tx('s2_btn'))+'</button><div class="err">'+esc(st.err)+'</div>';
  }else if(st.step===3){
    h='<div class="card msg"><div style="font-size:40px">🌾</div><div class="verse">“'+tx('s3_verse')+'”</div><div class="ref">'+tx('s3_ref')+'</div></div>'+
      '<button class="p" id="go3">'+tx('s3_btn')+'</button>';
  }else{
    h='<div class="card msg"><div class="big">'+tx('s4_title')+'</div><p>'+(st.dup?'이미 투표하셨습니다. 중복 투표는 반영되지 않았습니다.':tx('s4_msg')+' 🙏')+'</p></div>'+
      res+'<br><button class="lk" id="homeBtn">처음으로 돌아가기</button></div>';
  }
  app.innerHTML=h;
}

function tally(){
  var rec={},by={};
  TARGETS.forEach(function(g){rec[g]=0;});GROUPS.forEach(function(g){by[g]={};});
  st.rows.forEach(function(r){
    if(rec[r[2]]!==undefined)rec[r[2]]++;
    if(by[r[1]])by[r[1]][r[2]]=(by[r[1]][r[2]]||0)+1;
  });
  var rows=TARGETS.map(function(g){return{g:g,n:rec[g]};}).sort(function(a,b){return b.n-a.n;});
  var max=Math.max(1,rows[0].n);
  return '<p class="det">총 참여자 '+st.rows.length+'명</p><h2>득표 순위</h2><div class="scroll"><table><tr><th>대목장</th><th>득표</th></tr>'+
    rows.map(function(r){return '<tr><td>'+r.g+'<div class="bar" style="width:'+Math.round(r.n/max*100)+'%"></div></td><td><b>'+r.n+'</b></td></tr>';}).join('')+'</table></div>'+
    '<h2 style="margin-top:20px">목장·기관별 투표 내용</h2><div class="scroll"><table><tr><th>투표한 곳</th><th>투표 내용 (표 수)</th></tr>'+
    GROUPS.map(function(g){
      var ks=Object.keys(by[g]);
      var tot=ks.reduce(function(a,k){return a+by[g][k];},0);
      return '<tr><td>'+g+'<div class="det">'+tot+'명</div></td><td style="text-align:left">'+(ks.length?ks.map(function(k){return k+' '+by[g][k]+'표';}).join(', '):'-')+'</td></tr>';
    }).join('')+'</table></div>';
}
function comments(){
  var cs=st.rows.filter(function(r){return r[3];}).reverse();
  return '<p class="det">코멘트 '+cs.length+'개</p>'+(cs.length?cs.map(function(r){
    return '<div class="cm"><div class="det"><b>'+esc(r[2])+'</b></div>'+esc(r[3]).replace(/\n/g,'<br>')+'</div>';
  }).join(''):'<p class="det">작성된 코멘트가 없습니다.</p>');
}
function renderAdmin(){
  var back='<div class="bot" style="margin-top:8px"><button class="lk" id="back">← 투표로 돌아가기</button></div>';
  if(!st.auth){
    app.innerHTML=head('🔒 관리자 페이지','관리자 암호를 입력해 주세요')+
      '<div class="card"><input id="pw" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button class="p" id="login"'+(st.busy?' disabled':'')+'>들어가기</button><div class="err">'+esc(st.err)+'</div></div>'+back;
    return;
  }
  var body;
  if(!st.rows){body='불러오는 중…';}
  else{
    body='<div class="tabs"><button class="o'+(st.tab===1?' on':'')+'" id="tab1">집계</button><button class="o'+(st.tab===2?' on':'')+'" id="tab2">코멘트</button><button class="o'+(st.tab===3?' on':'')+'" id="tab3">문구 설정</button></div>'+
      (st.tab===1?tally():st.tab===2?comments():settingsForm())+
      '<div style="margin-top:24px;text-align:center"><button class="o" id="refresh">새로고침</button> '+
      (st.rc?'<p class="err">모든 투표가 삭제됩니다. 정말 초기화할까요?</p><button class="p" id="rst2">네, 초기화합니다</button><button class="o rb" id="rst0">취소</button>'
            :'<button class="o" id="rst">투표 초기화</button>')+
      '<div class="err">'+esc(st.err)+'</div></div>';
  }
  app.innerHTML=head('📊 관리자 집계','하모니상 투표 결과')+'<div class="card">'+body+'</div>'+back;
}
function settingsForm(){
  return '<p class="det">화면에 보이는 문구를 바꿀 수 있습니다. 저장하면 새로 접속하는 사람부터 바로 적용됩니다. 칸을 비우면 기본 문구가 나옵니다.</p>'+
    FIELDS.map(function(f){
      var v=CFG[f.k];
      var el=f.ml?'<textarea class="cf" id="cf_'+f.k+'" rows="3" maxlength="300">'+esc(v)+'</textarea>'
                  :'<input class="cf" id="cf_'+f.k+'" maxlength="100" value="'+esc(v)+'">';
      return '<label class="det lb" for="cf_'+f.k+'">'+esc(f.label)+'</label>'+el;
    }).join('')+
    '<button class="p" id="cfgSave"'+(st.busy?' disabled':'')+'>'+(st.busy?'저장 중…':'문구 저장')+'</button>'+
    '<button class="o rb" id="cfgReset">기본 문구로 되돌리기</button>'+
    (st.cfgMsg?'<p class="det" style="text-align:center">'+esc(st.cfgMsg)+'</p>':'')+'<div class="err">'+esc(st.err)+'</div>';
}
function load(){
  st.busy=true;
  google.script.run.withSuccessHandler(function(r){
    st.busy=false;
    if(r&&r.ok){st.auth=true;st.rows=r.rows;st.err="";}
    else{st.auth=false;st.rows=null;st.err="암호가 올바르지 않습니다.";}
    render();
  }).withFailureHandler(fail).getResults(st.pw);
}
function submit(){
  var d=devId();
  if(!d){st.err="브라우저 저장소를 사용할 수 없습니다. 시크릿 모드를 끄고 다시 시도해 주세요.";return render();}
  st.busy=true;st.err="";render();
  google.script.run.withSuccessHandler(function(r){
    st.busy=false;
    if(r&&r.ok){setVoted(true);st.step=3;}
    else if(r&&r.dup){setVoted(true);st.dup=true;st.step=4;}
    else st.err=(r&&r.msg)||"저장하지 못했습니다.";
    render();
  }).withFailureHandler(fail).submitVote(st.mine,st.pick,st.reason,d);
}

app.addEventListener("input",function(e){if(e.target.id==="why")st.reason=e.target.value;});
app.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.f){
    var g=b.dataset.g,f=b.dataset.f;
    st[f]=(st[f]===g?null:g);
    if(f==="mine"&&st.pick===g)st.pick=null;
    st.err="";return render();
  }
  switch(b.id){
    case "go1":if(st.mine){st.step=2;render();}break;
    case "go2":submit();break;
    case "go3":st.step=4;render();break;
    case "homeBtn":st.mine=null;st.pick=null;st.reason="";st.err="";st.dup=false;st.step=1;render();break;
    case "resBtn":st.view="admin";st.auth=false;st.rows=null;st.pw="";st.err="";render();break;
    case "back":st.view="vote";st.auth=false;st.rows=null;st.pw="";st.err="";st.rc=false;render();break;
    case "login":st.pw=document.getElementById("pw").value;st.err="";load();render();break;
    case "tab1":st.tab=1;render();break;
    case "tab2":st.tab=2;render();break;
    case "tab3":st.tab=3;st.cfgMsg="";st.err="";render();break;
    case "cfgSave":
      var o={};
      FIELDS.forEach(function(f){var el=document.getElementById("cf_"+f.k);if(el)o[f.k]=el.value;});
      CFG=Object.assign({},CFG,o);st.busy=true;st.err="";st.cfgMsg="";render();
      google.script.run.withSuccessHandler(function(r){
        st.busy=false;
        if(r&&r.ok){CFG=r.cfg;st.cfgMsg="저장되었습니다.";}else st.err="저장하지 못했습니다.";
        render();
      }).withFailureHandler(fail).saveSettings(st.pw,o);
      break;
    case "cfgReset":
      st.busy=true;st.err="";st.cfgMsg="";render();
      google.script.run.withSuccessHandler(function(r){
        st.busy=false;
        if(r&&r.ok){CFG=r.cfg;st.cfgMsg="기본 문구로 되돌렸습니다.";}else st.err="되돌리지 못했습니다.";
        render();
      }).withFailureHandler(fail).saveSettings(st.pw,{});
      break;
    case "refresh":st.rows=null;st.rc=false;load();render();break;
    case "rst":st.rc=true;render();break;
    case "rst0":st.rc=false;render();break;
    case "rst2":
      st.busy=true;
      google.script.run.withSuccessHandler(function(r){
        st.busy=false;st.rc=false;
        if(r&&r.ok){setVoted(false);st.rows=[];st.err="";}else st.err="초기화하지 못했습니다.";
        render();
      }).withFailureHandler(fail).resetVotes(st.pw);
      break;
  }
});
render();
// 관리자가 저장한 문구를 서버에서 불러와 적용
google.script.run.withSuccessHandler(function(c){
  if(c&&typeof c==='object'&&c.s1_title){CFG=c;if(!st.busy&&st.view==='vote'&&st.step===1)render();}
}).withFailureHandler(function(){}).getSettings();
</script>
</body>
</html>
